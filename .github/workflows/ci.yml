name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tap-checks:
    name: Tap checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test generator
        run: |
          node script/test-update-from-release.mjs
          node script/test-update-harn-from-release.mjs
          node script/test-publish-harn-formula.mjs
          node script/test-formula-url-preflight.mjs
          node script/test-public-install-gate.mjs
      - name: Install Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl file git procps
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
      - name: Tap local checkout
        run: brew tap burin-labs/burin "$PWD"
      - name: Style
        run: brew style burin-labs/burin/burin
      - name: Harn formula style
        run: brew style burin-labs/burin/harn
      - name: Formula audit
        run: |
          # The formula pins `version` and Homebrew calls that redundant,
          # because it scans a version out of the URL. What it scans is the
          # release tag, which is the app version; the formula ships the CLI,
          # whose version is `cliVersion` in release.json and can differ. So
          # the pin is the correct value and the scan is not, and only that one
          # audit is skipped.
          brew audit --formula --except=version burin-labs/burin/burin
      - name: Harn formula audit
        run: |
          # harn ships target-specific archives. Homebrew infers the arm URLs
          # correctly but misreads x86_64 target triples as versions, so the
          # formula pins the true release version and skips only that redundant
          # parser audit.
          brew audit --formula --except=version burin-labs/burin/harn
      - name: Harn formula install smoke
        run: |
          set -euo pipefail
          brew install burin-labs/burin/harn
          brew test burin-labs/burin/harn

  cask-checks:
    name: Cask checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tap local checkout
        run: brew tap burin-labs/burin "$PWD"
      - name: Style
        run: brew style burin-labs/burin/burin-code
      - name: Cask audit
        run: brew audit --cask burin-labs/burin/burin-code
      - name: Cask install smoke
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          VERSION="$(ruby -ne 'puts $1 if /^\s*version "([^"]+)"/ =~ $_' Casks/burin-code.rb | head -1)"
          # shellcheck disable=SC2016
          URL_TEMPLATE="$(ruby -ne 'puts $1 if /^\s*url "([^"]+)"/ =~ $_' Casks/burin-code.rb | head -1)"
          URL="${URL_TEMPLATE/\#\{version\}/${VERSION}}"
          if curl -fsIL "${URL}" >/dev/null; then
            brew install --cask burin-labs/burin/burin-code
            brew uninstall --cask burin-labs/burin/burin-code
          else
            echo "Skipping cask install smoke because ${URL} is not publicly reachable yet."
          fi

  regen-drift:
    name: Regen drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Fetch published release.json and regenerate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # NB: GitHub Actions wraps this script with `bash -e {0}`, so an
          # implicit `set -e` is already on. We deliberately use `|| true`
          # around the cross-repo `gh api` calls -- burin-code may be
          # private to the default GITHUB_TOKEN (404 -> nonzero exit) and
          # we want to skip cleanly in that case rather than fail the gate.
          set -uo pipefail
          # Whether a skip is allowed at all. Once public-install.json says the
          # public can install `burin`, the committed formula MUST be provably
          # regenerated from a real published release, and "could not check"
          # stops being an acceptable answer.
          PUBLIC_INSTALL_ENABLED="$(jq -r '.publicInstallEnabled' public-install.json)"
          skip_or_fail() {
            echo "regen-drift: $1" >> "$GITHUB_STEP_SUMMARY"
            if [ "${PUBLIC_INSTALL_ENABLED}" = "true" ]; then
              echo "::error::regen-drift cannot verify the tap against a published release, and public-install.json says the public can install \`burin\`. $1" >&2
              exit 1
            fi
            echo "$1"
            exit 0
          }
          RELEASES_JSON="$(gh api repos/burin-labs/burin-code/releases 2>/dev/null || true)"
          if [ -z "${RELEASES_JSON}" ]; then
            skip_or_fail "SKIPPED (could not list burin-code releases at all)"
          fi
          # `gh api ... || true` above swallows the exit code but leaves an
          # error-shaped JSON object (e.g. `{"message":"Not Found",...}`) in
          # RELEASES_JSON when the default GITHUB_TOKEN lacks cross-repo
          # access to a private burin-code. That is NOT the same fact as "there
          # are no published releases", and reporting it as such is how this job
          # spent weeks announcing that no release had been published while
          # burin-code v0.2.0 sat published with a release.json asset attached.
          if [ "$(printf '%s' "${RELEASES_JSON}" | jq -r 'type')" != "array" ]; then
            skip_or_fail "SKIPPED (no cross-repo read access to burin-labs/burin-code; this is an access fact, not a release fact)"
          fi
          RELEASE_TAG="$(printf '%s' "${RELEASES_JSON}" | jq -r '[.[] | select(.draft == false and .prerelease == false)] | .[0].tag_name // ""')"
          if [ -z "${RELEASE_TAG}" ]; then
            skip_or_fail "SKIPPED (burin-code has no published non-prerelease release)"
          fi
          MANIFEST_URL="$(gh api "repos/burin-labs/burin-code/releases/tags/${RELEASE_TAG}" --jq '.assets[] | select(.name == "release.json") | .url' 2>/dev/null || true)"
          if [ -z "${MANIFEST_URL}" ]; then
            skip_or_fail "SKIPPED (release ${RELEASE_TAG} has no release.json asset)"
          fi
          curl -fsSL -H "Accept: application/octet-stream" -H "Authorization: Bearer ${GH_TOKEN}" "${MANIFEST_URL}" -o /tmp/release.json
          node script/update-from-release.mjs --release-manifest /tmp/release.json
          if ! git diff --exit-code -- Formula/burin.rb Casks README.md; then
            echo "Regenerated Formula/Cask/README differ from committed copy for ${RELEASE_TAG}." >&2
            echo "Re-run \`node script/update-from-release.mjs --release-manifest release.json\` against the latest release and commit the result." >&2
            echo "regen-drift: FAILED -- committed tap does not match release ${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "regen-drift: OK -- committed tap matches release ${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"

  formula-url-preflight:
    name: Formula URL preflight
    runs-on: ubuntu-latest
    outputs:
      should_install: ${{ steps.classify.outputs.should_install }}
      status: ${{ steps.classify.outputs.status }}
      url: ${{ steps.classify.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test formula URL preflight
        run: node script/test-formula-url-preflight.mjs
      - name: Classify committed formula
        id: classify
        run: |
          set +e
          node script/formula-url-preflight.mjs Formula/burin.rb
          code=$?
          set -e
          message="$(grep '^message=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          case "$code" in
            0)
              echo "formula-url-preflight: OK — ${message}" >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "formula-url-preflight: HEAD-ONLY — ${message}; install smoke job will be skipped (not a silent-green success)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              echo "formula-url-preflight: UNREACHABLE — ${message}; install smoke job will be skipped (not a silent-green success)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::formula-url-preflight exited ${code}"
              exit "$code"
              ;;
          esac

  public-install-gate:
    name: Public install gate
    runs-on: ubuntu-latest
    needs: formula-url-preflight
    outputs:
      require_install_smoke: ${{ steps.gate.outputs.require_install_smoke }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Compare the tap against public-install.json
        id: gate
        env:
          PREFLIGHT_STATUS: ${{ needs.formula-url-preflight.outputs.status }}
        run: |
          # No `|| true` and no default status. An empty PREFLIGHT_STATUS is an
          # unknown status, and the gate exits non-zero on unknown rather than
          # reading it as "not ok" -- which would be indistinguishable from the
          # gated state this tap has been sitting in.
          set -o pipefail
          node script/public-install-gate.mjs public-install.json "${PREFLIGHT_STATUS}" \
            | tee /tmp/public-install-gate.txt
          echo "public-install-gate: $(cat /tmp/public-install-gate.txt)" >> "$GITHUB_STEP_SUMMARY"

  formula-install-smoke:
    name: Formula install smoke (${{ matrix.os }})
    needs: formula-url-preflight
    if: needs.formula-url-preflight.outputs.should_install == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl file git procps
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
      - name: Tap local checkout
        run: brew tap burin-labs/burin "$PWD"
      - name: Install and test formula
        run: |
          set -euo pipefail
          brew install burin-labs/burin/burin
          brew test burin-labs/burin/burin
          echo "formula-install-smoke: OK — installed and tested ${{ needs.formula-url-preflight.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs:
      [
        tap-checks,
        cask-checks,
        regen-drift,
        formula-url-preflight,
        public-install-gate,
        formula-install-smoke,
      ]
    if: always()
    steps:
      - name: Check aggregate result
        env:
          TAP_RESULT: ${{ needs.tap-checks.result }}
          CASK_RESULT: ${{ needs.cask-checks.result }}
          REGEN_RESULT: ${{ needs.regen-drift.result }}
          PREFLIGHT_RESULT: ${{ needs.formula-url-preflight.result }}
          GATE_RESULT: ${{ needs.public-install-gate.result }}
          REQUIRE_INSTALL_SMOKE: ${{ needs.public-install-gate.outputs.require_install_smoke }}
          INSTALL_RESULT: ${{ needs.formula-install-smoke.result }}
        run: |
          test "${TAP_RESULT}" = "success"
          test "${CASK_RESULT}" = "success"
          test "${REGEN_RESULT}" = "success"
          test "${PREFLIGHT_RESULT}" = "success"
          test "${GATE_RESULT}" = "success"
          # A skipped install smoke is only acceptable while public-install.json
          # says the public cannot install `burin` anyway. Once it says they can,
          # "did not run" stops being an answer: the whole reason #15 survived
          # this long is that a skip and a pass arrived here looking identical.
          if [ "${REQUIRE_INSTALL_SMOKE}" != "true" ] && [ "${REQUIRE_INSTALL_SMOKE}" != "false" ]; then
            echo "public-install-gate did not report require_install_smoke; refusing to guess." >&2
            exit 1
          fi
          if [ "${REQUIRE_INSTALL_SMOKE}" = "true" ]; then
            test "${INSTALL_RESULT}" = "success"
          else
            case "${INSTALL_RESULT}" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          fi
