name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tap-checks:
    name: Tap checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Test generator
        run: node script/test-update-from-release.mjs
      - name: Install Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl file git procps
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
      - name: Tap local checkout
        run: brew tap burin-labs/burin "$PWD"
      - name: Style
        run: brew style burin-labs/burin/burin
      - name: Formula audit
        run: brew audit --formula burin-labs/burin/burin
      - name: Formula install smoke
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          URL="$(ruby -ne 'puts $1 if /^\s*url "([^"]+)"/ =~ $_' Formula/burin.rb | head -1)"
          if [ -n "${URL}" ] && curl -fsIL "${URL}" >/dev/null; then
            brew install burin-labs/burin/burin
            brew test burin-labs/burin/burin
          else
            echo "Skipping formula install smoke because no stable formula URL is publicly reachable yet."
          fi

  cask-checks:
    name: Cask checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Tap local checkout
        run: brew tap burin-labs/burin "$PWD"
      - name: Style
        run: brew style burin-labs/burin/burin-code
      - name: Cask audit
        run: brew audit --cask burin-labs/burin/burin-code
      - name: Cask install smoke
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          VERSION="$(ruby -ne 'puts $1 if /^\s*version "([^"]+)"/ =~ $_' Casks/burin-code.rb | head -1)"
          # shellcheck disable=SC2016
          URL_TEMPLATE="$(ruby -ne 'puts $1 if /^\s*url "([^"]+)"/ =~ $_' Casks/burin-code.rb | head -1)"
          URL="${URL_TEMPLATE/\#\{version\}/${VERSION}}"
          if curl -fsIL "${URL}" >/dev/null; then
            brew install --cask burin-labs/burin/burin-code
            brew uninstall --cask burin-labs/burin/burin-code
          else
            echo "Skipping cask install smoke because ${URL} is not publicly reachable yet."
          fi

  regen-drift:
    name: Regen drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Fetch published release.json and regenerate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pull the most recent non-draft release.json from burin-labs/burin-code.
          # If none is published yet (pre-user, all releases draft) we skip with
          # a noisy log so this gate doesn't block PRs before the first release.
          RELEASE_TAG="$(gh api repos/burin-labs/burin-code/releases --jq '[.[] | select(.draft == false and .prerelease == false)] | .[0].tag_name // ""')"
          if [ -z "${RELEASE_TAG}" ]; then
            echo "No published release.json yet; skipping regen-drift check."
            echo "regen-drift: SKIPPED (no published release)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          MANIFEST_URL="$(gh api "repos/burin-labs/burin-code/releases/tags/${RELEASE_TAG}" --jq '.assets[] | select(.name == "release.json") | .url')"
          if [ -z "${MANIFEST_URL}" ]; then
            echo "Release ${RELEASE_TAG} has no release.json asset; skipping."
            echo "regen-drift: SKIPPED (no release.json asset on ${RELEASE_TAG})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsSL -H "Accept: application/octet-stream" -H "Authorization: Bearer ${GH_TOKEN}" "${MANIFEST_URL}" -o /tmp/release.json
          node script/update-from-release.mjs --release-manifest /tmp/release.json
          if ! git diff --exit-code -- Formula Casks README.md; then
            echo "Regenerated Formula/Cask/README differ from committed copy for ${RELEASE_TAG}." >&2
            echo "Re-run \`node script/update-from-release.mjs --release-manifest release.json\` against the latest release and commit the result." >&2
            echo "regen-drift: FAILED -- committed tap does not match release ${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "regen-drift: OK -- committed tap matches release ${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [tap-checks, cask-checks, regen-drift]
    if: always()
    steps:
      - name: Check aggregate result
        env:
          TAP_RESULT: ${{ needs.tap-checks.result }}
          CASK_RESULT: ${{ needs.cask-checks.result }}
          REGEN_RESULT: ${{ needs.regen-drift.result }}
        run: |
          test "${TAP_RESULT}" = "success"
          test "${CASK_RESULT}" = "success"
          test "${REGEN_RESULT}" = "success"
