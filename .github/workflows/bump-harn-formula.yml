name: Bump Harn Formula

# Harn Fleet dispatches this repository-owned producer for each release. The
# daily schedule is only a recovery alarm for a missed dispatch.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact Harn release tag (vX.Y.Z); the recovery schedule resolves latest."
        required: true
        type: string
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: read

concurrency:
  group: bump-harn-formula
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Establish the publishing identity before checkout so persisted checkout
      # credentials cannot supersede the App that owns the server-side commit.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          permission-contents: write
          permission-pull-requests: write
          # Creating a branch from main also carries the checked-in workflow
          # tree. GitHub therefore requires the App's existing Workflows write
          # permission even though the producer changes only Formula/harn.rb.
          permission-workflows: write

      - name: Checkout with publishing identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Resolve the target Harn release
        id: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_VERSION:-}"
          if [ -z "${TAG}" ]; then
            TAG="$(gh api repos/burin-labs/harn/releases/latest --jq '.tag_name')"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing a target that is not an exact stable Harn tag: '${TAG}'" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Fetch the authoritative release payload
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.target.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/burin-labs/harn/releases/tags/${TAG}" > "${RUNNER_TEMP}/harn-release.json"

      # The producer downloads all four macOS/Linux archives, compares their
      # SHA-256 values to one validated manifest, then uses GitHub's
      # createCommitOnBranch mutation under an exact observed-head lease. It
      # refuses moved or armed heads and verifies the returned head is signed
      # by GitHub before opening a non-draft PR.
      - name: Publish signed version-qualified formula update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          node script/publish-harn-formula.mjs \
            --release-json "${RUNNER_TEMP}/harn-release.json" \
            --version "${TAG}" \
            --receipt "${RUNNER_TEMP}/harn-formula-receipt.json"

      - name: Upload typed producer receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-formula-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/harn-formula-receipt.json
          if-no-files-found: error
          retention-days: 30
